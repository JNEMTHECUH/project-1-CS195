  <link rel="stylesheet" href="style.css">
</head>
<body class="game page">
  
  <header>
    <h1>Tic Tac Toe</h1>
  </header>

  <main>

    <div id="message">Player X's turn</div>

    <!-- 3x3 game board -->

      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>

    <!-- Game controls -->
    <div class="controls">
      <button id="reset">Reset Game</button>
      <a href="index.html" class="home-button">Back to Home</a>
    </div>
  </main>

  <footer>
